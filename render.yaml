# ─────────────────────────────────────────────────────────────────────────────
# Render IaC — academia backend
#
# Auto-deploy is DISABLED on both services.
# Deployments are triggered exclusively by the CI deploy-gate job via
# deploy hooks stored as GitHub secrets (RENDER_DEPLOY_HOOK_PROD/STAGING).
#
# One-time setup after connecting this repo in Render:
#   1. Each service → Settings → Deploy Hook → Create → copy URL
#   2. gh secret set RENDER_DEPLOY_HOOK_PROD --body "<url>"
#   3. gh secret set RENDER_DEPLOY_HOOK_STAGING --body "<url>"
#
# Sensitive env vars must be added manually in the Render dashboard
# (Environment tab of each service) — they are NOT stored here.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Production ──────────────────────────────────────────────────────────────
  - type: web
    name: academia-backend
    env: node
    plan: free
    region: frankfurt          # closest region to Nigeria
    branch: main
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false          # CI-only deploys via deploy hook

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ⚠ Add these in the Render dashboard → Environment (never commit values)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Comma-separated Vercel URLs. Example:
      # https://academia.vercel.app,https://academia-git-staging-honour-boy.vercel.app
      - key: FRONTEND_ORIGIN
        sync: false

  # ── Staging ─────────────────────────────────────────────────────────────────
  - type: web
    name: academia-backend-staging
    env: node
    plan: free
    region: frankfurt
    branch: staging
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false          # CI-only deploys via deploy hook

    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
