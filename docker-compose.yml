# Academia — Docker Compose
# Used for local development parity and Coolify production deployment.
# Backend is currently Next.js Server Actions (no separate Express service yet).
# When a standalone backend is added, uncomment and configure the `backend` service.
#
# Bible requirement: resource limits on every service.

version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./frontend/.env.local      # local only — Coolify injects secrets in prod
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M

  # ── Uncomment when Express backend is added ───────────────────────────────
