name: CI

# Runs on every push to main/staging and on every PR targeting those branches.
# Vercel and Render both auto-deploy on push — CI acts as the gate:
#   staging push  → preview deployment (Vercel preview + Render staging)
#   main push     → production deployment (Vercel prod + Render prod)
# Neither platform deploys if any CI job fails (configured in each dashboard
# under "Deploy on commit that passes CI checks").

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint · typecheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          # Supabase stubs — real values never needed for unit tests
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint · typecheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          # Stubs — no real Supabase calls during tests
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_JWT_SECRET: placeholder-jwt-secret-32-chars-min!
          FRONTEND_ORIGIN: http://localhost:3000

  # ── Migrations ──────────────────────────────────────────────────────────────
  migrations:
    name: Migrations — validate SQL files exist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check migration files exist
        run: |
          count=$(find supabase/migrations -name "*.sql" | wc -l)
          echo "Found $count migration file(s)"
          if [ "$count" -eq 0 ]; then
            echo "❌ No migration files found — create at least one in supabase/migrations/"
            exit 1
          fi
          echo "✅ Migration files OK"

  # ── Deploy gate ─────────────────────────────────────────────────────────────
  # This job exists solely so Vercel and Render can check
  # "all required status checks must pass" before deploying.
  # It runs after all other jobs and succeeds only if they all do.
  deploy-gate:
    name: Deploy gate — all checks passed
    needs: [frontend, backend, migrations]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - run: echo "✅ All CI checks passed — Vercel and Render can deploy."
